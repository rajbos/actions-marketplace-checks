name: Run Pester tests

on:
  push:
    paths:
    - .github/workflows/*.ps1
    - tests/*.ps1
    - .github/workflows/pester-tests.yml
  pull_request:
    branches:
      - main

defaults:
  run:
    shell: pwsh

jobs:
  pester-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        # No fetch-depth: 0 here - this repo's history contains large JSON
        # snapshots (status.json etc.) across many commits, which made a full
        # clone take ~20 minutes. A shallow checkout (default depth) is all
        # that's needed since the PS1-change check below uses the GitHub API
        # instead of local git history.

      - name: Check for PS1 file changes
        id: ps1-check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[].filename' | grep -qE '\.ps1$'; then
              echo "changed=true" >> $GITHUB_OUTPUT
              echo "PS1 files changed, running tests"
            else
              echo "changed=false" >> $GITHUB_OUTPUT
              echo "No PS1 files changed, skipping tests"
            fi
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Get current actions list
        if: steps.ps1-check.outputs.changed == 'true'
        shell: pwsh
        env:
          BLOB_SAS_TOKEN: "${{ secrets.BLOB_SAS_TOKEN }}"
        run: |
          . ./.github/workflows/library.ps1
          $result = Get-ActionsJsonFromBlobStorage -sasToken $env:BLOB_SAS_TOKEN -localFilePath "actions.json"
          if (-not $result) {
            Write-Error "Failed to download actions.json from blob storage"
            exit 1
          }
          
          Write-Host "First 10 lines of actions.json:"
          Get-Content "actions.json" -TotalCount 10 | ForEach-Object { Write-Host $_ }
      
      - name: Run Pester Tests
        if: steps.ps1-check.outputs.changed == 'true'
        run: Invoke-Pester -Output Normal
